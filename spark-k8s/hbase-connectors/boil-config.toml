# Unreleased upstream code: there is no hbase-connectors release that supports Spark 4.x yet.
# The `spark4` modules (HBASE-30179 and follow-ups) are only on the master branch, so each
# version is pinned to an upstream commit (see the `base` of the patchable.toml of that version).
# The version is `<upstream revision>-<short commit sha>_<Spark version>`.

[versions."1.1.0-SNAPSHOT-07f5791_4.1.2".local-images]
java-devel = "21"

[versions."1.1.0-SNAPSHOT-07f5791_4.1.2".build-arguments]
spark-version = "4.1.2"
hadoop-version = "3.4.3"
hbase-version = "2.6.6"
# The following two must match the hbase-thirdparty (and its bundled protobuf)
# shipped by the hbase-shaded-client in the final Spark image. That client comes
# from the `hbase` local-image in spark-k8s/boil-config.toml (currently 2.6.6),
# whose hbase-thirdparty is 4.1.13 -> protobuf 4.34.0. Keep these in sync if the
# Spark image's HBASE_VERSION changes.
hbase-thirdparty-version = "4.1.13"
thirdparty-protobuf-version = "4.34.0"

[versions."1.1.0-SNAPSHOT-07f5791_4.1.3".local-images]
java-devel = "21"

[versions."1.1.0-SNAPSHOT-07f5791_4.1.3".build-arguments]
spark-version = "4.1.3"
hadoop-version = "3.4.3"
hbase-version = "2.6.6"
# See the comment above.
hbase-thirdparty-version = "4.1.13"
thirdparty-protobuf-version = "4.34.0"

[versions."1.1.0-SNAPSHOT-07f5791_4.2.0".local-images]
java-devel = "25"

[versions."1.1.0-SNAPSHOT-07f5791_4.2.0".build-arguments]
spark-version = "4.2.0"
hadoop-version = "3.5.0"
hbase-version = "2.6.6"
# See the comment above.
hbase-thirdparty-version = "4.1.13"
thirdparty-protobuf-version = "4.34.0"
