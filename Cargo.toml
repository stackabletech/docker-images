[workspace]
members = ["rust/*"]
resolver = "2"

[workspace.package]
repository = "https://github.com/stackabletech/docker-images"
authors = ["Stackable <info@stackable.tech>"]
license = "Apache-2.0"

[workspace.dependencies]
cap-std = "4.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
clap_complete_nushell = "4.6"
git2 = { version = "0.21", features = ["cred", "ssh", "https"] }
glob = "0.3"
humansize = "2.1"
oci-spec = "0.10"
reqwest = { version = "0.13", features = ["json"] }
rstest = "0.27"
secrecy = "0.10"
regex = "1.13"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snafu = "0.9"
strum = { version = "0.28", features = ["derive"] }
tempfile = "3.27"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1.53", features = ["rt", "macros", "process"] }
toml = "1.1"
tracing = "0.1"
tracing-indicatif = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }

[workspace.lints.clippy]
unwrap_in_result = "deny"
unwrap_used = "deny"
panic = "deny"
