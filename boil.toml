[build-arguments]
STACKABLE_USER_NAME = "stackable"
STACKABLE_USER_UID = "1000"
STACKABLE_USER_GID = "1000"
DELETE_CACHES = "true"
# CycloneDX specification version used for the SBOMs generated by cdxgen.
# 1.6 is the lowest version cdxgen 13 accepts as a generation target.
CDXGEN_SPEC_VERSION = "1.6"

[metadata]
documentation = "https://docs.stackable.tech/home/stable/"
source = "https://github.com/stackabletech/docker-images/"
authors = "Stackable GmbH <info@stackable.tech>"
vendor-tag-prefix = "stackable"
vendor = "Stackable GmbH"
licenses = "Apache-2.0"
