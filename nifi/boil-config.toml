[metadata.registries]
"oci.stackable.tech" = { namespace = "sdp" }

[versions."2.6.0".local-images]
java-base = "21"
java-devel = "21"
"shared/logback" = "1.5.18" # https://github.com/apache/nifi/blob/rel/nifi-2.6.0/pom.xml#L156

[versions."2.6.0".build-arguments]
git-sync-version = "v4.6.0"
# Only used to run cdxgen, which creates the SBOM of the frontend (npm) dependencies.
# cdxgen requires Node 20, 22 or 24. The Node version used for the actual frontend
# build is pinned by NiFi itself (see nifi-frontend/pom.xml).
nodejs-version = "22.22.0"
# Find the latest version here: https://www.npmjs.com/package/@cyclonedx/cdxgen
# renovate: datasource=npm packageName=@cyclonedx/cdxgen
cdxgen-version = "12.8.3"
# Check for new versions at the upstream: https://github.com/stackabletech/nifi-opa-plugin/tags
# Checkout a Patchable version (patch-series) for the new tag
nifi-opa-authorizer-plugin-version = "0.6.0"

# Release a new version here: https://github.com/stackabletech/nifi-iceberg-bundle
# Checkout a Patchable version (patch-series) for the new tag
nifi-iceberg-bundle-version = "0.0.5"

