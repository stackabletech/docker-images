---
fail_fast: false
exclude: \.patch$

default_language_version:
  node: system

repos:
  - repo: local
    hooks:
      - id: cargo-test
        name: cargo-test
        language: system
        entry: cargo test --package patchable
        stages: [pre-commit, pre-merge-commit]
        pass_filenames: false
        files: .*\.rs$|Cargo\.toml
