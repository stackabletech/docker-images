# What sbom-quality expects from the SBOMs of our images. See README.md.
#
# The settings below apply to every image. [operators] and each [products.<name>] can override
# them and add:
#
#   main-component        purl of the product itself, which has to be listed in the version of
#                         the image. "{version}" also matches "{version}-stackable0.0.0-dev".
#   embedded-sboms        build-time SBOMs in the image that components have to come from.
#   min-components        smallest allowed number of components: `total`, per purl type
#                         (`maven`) and per purl type from build-time SBOMs (`embedded-maven`).
#   min-license-coverage  smallest allowed share of components with a license.
#   ignore                IDs of checks whose findings are accepted. Say why in a comment.
#   versions."<version>"  any of the above for one version that differs from the others.
#
# {version}, {release} and {image} are replaced in main-component and embedded-sboms.
#
# The numbers were generated with `cargo sbom-quality --suggest-floors` (20% below the smallest
# count of any version and architecture). Lower one when a count dropped for a good reason, and
# raise them now and then, a floor far below reality catches nothing.

registry = "oci.stackable.tech/sdp"
release = "0.0.0-dev"
architectures = ["amd64", "arm64"]

# What publish-image writes once stackabletech/actions#153 and #154 are in use.
cyclonedx-spec-version = "1.7"

# The dev images are rebuilt every two days. An older image means the build is failing, and
# then its SBOM does not describe what main would produce either.
max-image-age-days = 7

# Purl namespace of the installed RPMs and name of the operating-system component.
operating-system = "redhat"

# Share of components that may lack a purl or a version. A few really have neither, like the
# launcher stubs that pip ships or the jars of a JDK.
max-without-purl = 0.05
max-without-version = 0.05

# Directories with a boil-config.toml that are not checked: intermediate images and optional
# test images, which SDP customers do not use. Every other one needs a [products.<name>] table,
# so a new product cannot be forgotten here.
unchecked = [
  "java-base",
  "java-devel",
  "jdk-base",
  "kafka-testing-tools",
  "krb5",
  "spark-connect-client",
  "stackable-base",
  "stackable-devel",
  "testing-tools",
  "tools",
  "trino-cli",
  "vector",
]

[operators]
images = [
  "airflow-operator",
  "commons-operator",
  "druid-operator",
  "hbase-operator",
  "hdfs-operator",
  "hive-operator",
  "kafka-operator",
  "listener-operator",
  "nifi-operator",
  "opa-operator",
  "opensearch-operator",
  "secret-operator",
  "spark-k8s-operator",
  "superset-operator",
  "trino-operator",
  "zookeeper-operator",
]
main-component = "pkg:cargo/stackable-{image}@{release}"
min-license-coverage = 0.95
embedded-sboms = [
  "/usr/local/bin/stackable-{image}_bin.cdx.xml",
]

[operators.min-components]
total = 350
rpm = 84
cargo = 270
embedded-cargo = 270

[products.airflow]
main-component = "pkg:pypi/apache-airflow@{version}"
min-license-coverage = 0.88
embedded-sboms = [
  "/stackable/app/airflow-ui-{version}.cdx.json",
  "/stackable/app/airflow-{version}.cdx.json",
  "/stackable/cert-tools_bin.cdx.xml",
  "/stackable/config-utils.cdx.xml",
  "/stackable/containerdebug_bin.cdx.xml",
  "/stackable/statsd_exporter-*.cdx.json",
  "/usr/local/bin/vector_bin.cdx.xml",
]

