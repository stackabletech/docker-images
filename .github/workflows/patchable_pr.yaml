---
name: Build patchable

on:
  pull_request:
    paths:
      - ".github/workflows/patchable_pr.yaml"
      - "rust-toolchain.toml"
      - "rust/patchable/**.rs"
      - "Cargo.*"

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.97.1

jobs:
  # This job is always run to ensure we don't miss any new upstream advisories
  cargo-deny:
    name: Run cargo-deny
    runs-on: ubuntu-latest
    # Prevent sudden announcement of a new advisory from failing CI
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  build:
    name: Build patchable
    needs:
      - cargo-deny
    strategy:
      fail-fast: false
      matrix:
        targets:
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.targets.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust Toolchain
        env:
          RUST_TARGETS: ${{ matrix.targets.target }}
        shell: bash
        run: rustup toolchain install "${RUST_TOOLCHAIN_VERSION}" --target "${RUST_TARGETS}"

      - name: Build Binary
        env:
          RUST_TARGETS: ${{ matrix.targets.target }}
        run: cargo build --target "${RUST_TARGETS}" --package patchable
