#
# printf 'pyspark[connect]==4.2.0\njupyterlab\nscikit-learn\nmatplotlib\npyarrow\n' \
#   | uv pip compile - --python-version 3.14 --no-header --no-annotate \
#   | grep -iE '^(pyspark|jupyterlab|scikit-learn|matplotlib|pyarrow|numpy|pandas)=='
#
# Change the pyspark[connect] version accordingly.
[versions."4.2.0".build-arguments]
